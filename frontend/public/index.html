<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuloong API Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-5xl mx-auto space-y-8">
        
        <header class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">Tuloong API Tester</h1>
                <p class="text-sm text-gray-500">Gunakan halaman ini untuk mengetes endpoint Laravel API (Pastikan php artisan serve berjalan di port 8000)</p>
            </div>
            <div id="authStatus" class="px-4 py-2 bg-red-100 text-red-700 rounded-md font-semibold text-sm">
                Belum Login
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Forms -->
            <div class="space-y-6">
                <!-- Login Form -->
                <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
                    <h2 class="text-lg font-bold mb-4">Login</h2>
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="loginEmail" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="admin@tuloong.com" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" id="loginPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" value="admin123" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Login</button>
                    </form>
                </div>

                <!-- Register Form (Pelanggan) -->
                <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500">
                    <h2 class="text-lg font-bold mb-4">Register Pelanggan</h2>
                    <form id="registerForm" class="space-y-4">
                        <div><label class="block text-sm">Nama</label><input type="text" id="regNama" class="w-full border p-2 rounded" required></div>
                        <div><label class="block text-sm">Email</label><input type="email" id="regEmail" class="w-full border p-2 rounded" required></div>
                        <div><label class="block text-sm">No Telepon</label><input type="text" id="regTelp" class="w-full border p-2 rounded" required></div>
                        <div><label class="block text-sm">Password</label><input type="password" id="regPass" class="w-full border p-2 rounded" required></div>
                        <div><label class="block text-sm">Konfirmasi Password</label><input type="password" id="regPassConf" class="w-full border p-2 rounded" required></div>
                        <div class="grid grid-cols-3 gap-2">
                            <div><label class="block text-sm">Provinsi</label><input type="text" id="regProv" class="w-full border p-2 rounded" required></div>
                            <div><label class="block text-sm">Kabupaten</label><input type="text" id="regKab" class="w-full border p-2 rounded" required></div>
                            <div><label class="block text-sm">Kecamatan</label><input type="text" id="regKec" class="w-full border p-2 rounded" required></div>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700">Register</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: API Tests -->
            <div class="space-y-6">
                <!-- Action Buttons -->
                <div class="bg-white p-6 rounded-lg shadow-md grid grid-cols-2 gap-4">
                    <button onclick="testApi('GET', '/settings/public')" class="bg-gray-800 text-white p-2 rounded">Get Public Settings</button>
                    <button onclick="testApi('GET', '/me', true)" class="bg-purple-600 text-white p-2 rounded">Get My Profile (Auth)</button>
                    <button onclick="testApi('GET', '/admin/settings', true)" class="bg-indigo-600 text-white p-2 rounded">Admin Settings (Admin)</button>
                    <button onclick="testApi('GET', '/admin/mitra', true)" class="bg-indigo-700 text-white p-2 rounded">Admin List Mitra (Admin)</button>
                    <button onclick="testLogout()" class="bg-red-600 text-white p-2 rounded col-span-2">Logout</button>
                </div>

                <!-- API Response Output -->
                <div class="bg-gray-900 rounded-lg shadow-md overflow-hidden flex flex-col h-[500px]">
                    <div class="bg-gray-800 text-gray-200 px-4 py-2 text-sm font-mono border-b border-gray-700 flex justify-between">
                        <span>API Response</span>
                        <span id="responseStatus"></span>
                    </div>
                    <div class="p-4 overflow-y-auto flex-1 text-sm font-mono text-green-400" id="jsonOutput">
                        Klik salah satu tombol di atas untuk melihat respon API...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        let token = localStorage.getItem('tuloong_token');

        function updateAuthStatus() {
            const statusEl = document.getElementById('authStatus');
            if (token) {
                statusEl.textContent = 'Login Aktif (Token Tersimpan)';
                statusEl.className = 'px-4 py-2 bg-green-100 text-green-700 rounded-md font-semibold text-sm';
            } else {
                statusEl.textContent = 'Belum Login';
                statusEl.className = 'px-4 py-2 bg-red-100 text-red-700 rounded-md font-semibold text-sm';
            }
        }
        updateAuthStatus();

        function outputJSON(data, statusText = '') {
            document.getElementById('jsonOutput').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            document.getElementById('responseStatus').textContent = statusText;
        }

        async function testApi(method, endpoint, requiresAuth = false, body = null) {
            outputJSON({ message: "Loading..." });
            
            const headers = {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            };

            if (requiresAuth) {
                if (!token) {
                    outputJSON({ error: "Token tidak ditemukan. Silakan login terlebih dahulu." }, "Error");
                    return;
                }
                headers['Authorization'] = `Bearer ${token}`;
            }

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: method,
                    headers: headers,
                    body: body ? JSON.stringify(body) : null
                });

                const data = await response.json();
                outputJSON(data, `HTTP ${response.status}`);
            } catch (error) {
                outputJSON({ error: error.message }, "Fetch Error");
            }
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            await testApi('POST', '/login', false, { email, password });
            
            // Try to extract token from output
            const outText = document.getElementById('jsonOutput').innerText;
            try {
                const res = JSON.parse(outText);
                if (res.success && res.data && res.data.token) {
                    token = res.data.token;
                    localStorage.setItem('tuloong_token', token);
                    updateAuthStatus();
                }
            } catch (e) {}
        });

        // Handle Register Pelanggan
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                role: 'pelanggan',
                nama: document.getElementById('regNama').value,
                email: document.getElementById('regEmail').value,
                nomor_telepon: document.getElementById('regTelp').value,
                password: document.getElementById('regPass').value,
                password_confirmation: document.getElementById('regPassConf').value,
                provinsi: document.getElementById('regProv').value,
                kabupaten: document.getElementById('regKab').value,
                kecamatan: document.getElementById('regKec').value,
            };

            await testApi('POST', '/register', false, body);
            
            const outText = document.getElementById('jsonOutput').innerText;
            try {
                const res = JSON.parse(outText);
                if (res.success && res.data && res.data.token) {
                    token = res.data.token;
                    localStorage.setItem('tuloong_token', token);
                    updateAuthStatus();
                }
            } catch (e) {}
        });

        // Handle Logout
        async function testLogout() {
            if (!token) return;
            await testApi('POST', '/logout', true);
            token = null;
            localStorage.removeItem('tuloong_token');
            updateAuthStatus();
        }
    </script>
</body>
</html>
